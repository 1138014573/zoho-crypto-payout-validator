<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AllSwap Crypto Payout Validator</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 16px; color: #333; }
    h2 { font-size: 16px; margin-bottom: 12px; color: #0052cc; }
    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 4px; }
    input, select { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; }
    button { background: #0052cc; color: #fff; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    button:hover { background: #0747a6; }
    #result { margin-top: 12px; padding: 10px; border-radius: 4px; font-size: 12px; display: none; }
    .valid { background: #e3fcef; color: #006644; border: 1px solid #abf5d1; }
    .invalid { background: #ffebe6; color: #bf2600; border: 1px solid #ffbdad; }
  </style>
</head>
<body>
  <h2>AllSwap Payout & Memo Validator (Zoho Extension)</h2>
  <div class="form-group">
    <label for="network">Blockchain Network</label>
    <select id="network">
      <option value="ethereum">Ethereum / EVM (ETH, USDT, USDC)</option>
      <option value="solana">Solana (SOL, SPL Tokens)</option>
      <option value="bitcoin">Bitcoin (BTC - SegWit/Taproot/Legacy)</option>
      <option value="tron">TRON (TRX, TRC-20 USDT)</option>
      <option value="ton">The Open Network (TON)</option>
      <option value="xrp">XRP Ledger (XRP)</option>
    </select>
  </div>
  <div class="form-group">
    <label for="address">Recipient Payout Address</label>
    <input type="text" id="address" placeholder="Enter recipient crypto wallet address">
  </div>
  <div class="form-group">
    <label for="memo">Destination Tag / Memo (if exchange deposit)</label>
    <input type="text" id="memo" placeholder="Optional for private wallets, required for exchanges">
  </div>
  <button onclick="validatePayout()">Verify Address & Safety</button>
  <div id="result"></div>

  <script>
    const patterns = {
      ethereum: /^0x[a-fA-F0-9]{40}$/,
      solana: /^[1-9A-HJ-NP-Za-km-z]{32,44}$/,
      bitcoin: /^(bc1[a-z0-9]{39,59}|[13][a-km-zA-HJ-NP-Z1-9]{25,34})$/,
      tron: /^T[a-km-zA-HJ-NP-Z1-9]{33}$/,
      ton: /^(EQ|UQ)[a-zA-Z0-9_-]{46}$/,
      xrp: /^r[1-9A-HJ-NP-Za-km-z]{24,34}$/
    };
    const memoChains = ['ton', 'xrp'];

    function validatePayout() {
      const net = document.getElementById('network').value;
      const addr = document.getElementById('address').value.trim();
      const memo = document.getElementById('memo').value.trim();
      const res = document.getElementById('result');
      res.style.display = 'block';

      if (!patterns[net].test(addr)) {
        res.className = 'invalid';
        res.innerHTML = '<strong>INVALID ADDRESS:</strong> Address format does not match ' + net.toUpperCase() + ' checksum rules.';
        return;
      }
      if (memoChains.includes(net) && !memo) {
        res.className = 'invalid';
        res.innerHTML = '<strong>WARNING:</strong> ' + net.toUpperCase() + ' addresses require a Memo / Destination Tag for exchange deposits to prevent loss of funds!';
        return;
      }
      res.className = 'valid';
      res.innerHTML = '<strong>VERIFIED:</strong> Address and memo syntax are safe for payout. Supported by <a href="https://allswap.io/" target="_blank">AllSwap Protocol</a>.';
    }
  </script>
</body>
</html>
